<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF2F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Loops">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Open Loops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: desktop = left rail of lists with counts + one work column; phone = scrolling list strip on top, capture bar fixed to the bottom. */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --ink:#13232B; --muted:#586B74; --line:#D5DEE1;
  --accent:#0E6B68; --accent-ink:#FFFFFF; --accent-soft:#DCEEED;
  --signal:#C2410C; --signal-soft:#FBE6DC; --ok:#2F7D4F; --focus:#0E6B68;
  --font-display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1619; --surface:#162227; --ink:#E4EEF0; --muted:#90A4AC; --line:#26373E;
    --accent:#4FC3BD; --accent-ink:#07201F; --accent-soft:#16363A;
    --signal:#FF8F66; --signal-soft:#3A2218; --ok:#6CCB8E; --focus:#4FC3BD; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1619; --surface:#162227; --ink:#E4EEF0; --muted:#90A4AC; --line:#26373E;
  --accent:#4FC3BD; --accent-ink:#07201F; --accent-soft:#16363A;
  --signal:#FF8F66; --signal-soft:#3A2218; --ok:#6CCB8E; --focus:#4FC3BD; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,p{margin:0}

.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:44px;max-width:1040px;margin:0 auto;padding-top:28px}
.rail{position:sticky;top:28px;align-self:start;min-width:0}
.brand{font:800 24px/1.1 var(--font-display);letter-spacing:-.025em}
.tag{font:400 11px var(--font-mono);color:var(--muted);letter-spacing:.08em;margin:5px 0 18px}
.nav{display:flex;flex-direction:column;gap:2px}
.grp{font:500 10.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 10px 4px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;border-radius:8px;padding:8px 10px;text-align:left;white-space:nowrap}
.nb:hover{background:var(--accent-soft)}
.nb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cnt{font:500 12px var(--font-mono);color:var(--muted)}
.cnt.sig{color:var(--signal);font-weight:600}

main{min-width:0;padding-bottom:48px}
.cap{display:flex;gap:8px;margin:0 0 22px}
.in{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0}
textarea.in{resize:vertical;line-height:1.45}
.cap .in{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:500;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--signal);border-color:var(--signal)}
.btn.danger:hover:not(:disabled){color:var(--signal);background:var(--signal-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.big{padding:12px 18px;font-size:15.5px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--accent)}

.banner{background:var(--signal-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:14px}
.vh h1{font:800 30px/1.1 var(--font-display);letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 20px;max-width:62ch}
.sec{display:flex;align-items:baseline;gap:8px;font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.sec.sig{color:var(--signal)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.row+.row{border-top:1px solid var(--line)}
.row.center{align-items:center}
.chk{position:relative;flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0}
.chk::after{content:"";position:absolute;inset:-12px}
.chk:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.chk.on{background:var(--ok);border-color:var(--ok);opacity:1}
.chk.on::before{content:"";position:absolute;left:5.5px;top:2px;width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.rbody{flex:1;min-width:0}
.rtitle{display:block;max-width:100%;background:none;border:0;padding:0;text-align:left;font:500 15.5px/1.35 var(--font-body);overflow-wrap:anywhere}
.rtitle:hover{color:var(--accent)}
.rtitle.struck{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:500 11.5px/1.4 var(--font-mono);padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0;max-width:100%;overflow-wrap:anywhere}
button.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.sig{background:var(--signal-soft);color:var(--signal)}
.chip.quiet{background:none;color:var(--muted);padding-left:0}
.note{color:var(--muted);font-size:13.5px;margin-top:4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}

.empty{padding:30px 22px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty strong{display:block;font:700 19px var(--font-display);color:var(--ink);margin-bottom:6px}
.empty .choices{margin-top:16px}

.clar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:8px}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.thing{font:600 19px/1.35 var(--font-display);padding:12px 14px;background:var(--bg);border-radius:10px;overflow-wrap:anywhere}
.q{font:800 24px/1.2 var(--font-display);letter-spacing:-.02em;margin-top:20px;text-wrap:balance}
.hint{color:var(--muted);margin-top:4px;max-width:56ch}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.clar form{margin-top:16px}
.clar .link{margin-top:14px;display:block}
.clar .links{display:flex;gap:18px;flex-wrap:wrap}

.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.fc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.fc:hover{border-color:var(--accent)}
.fc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fcn{font:500 11.5px var(--font-mono);opacity:.75;margin-left:4px}
.inl{display:flex;gap:8px;margin:10px 0 0}
.inl .in{flex:1}
.newp{display:flex;gap:8px;margin:0 0 18px}
.newp .in{flex:1}
.refbar{display:flex;gap:8px;margin:0 0 16px}
.refbar .in{flex:1}
.back{margin:0 0 14px}

.fld{display:grid;gap:6px;margin-bottom:14px}
.fld label,.lbl{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv-st{font:500 12px var(--font-mono);color:var(--muted);text-align:right}
.rv-st.sig{color:var(--signal)}
.rv-st.ok{color:var(--ok)}
.rvtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;max-width:min(92vw,520px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast span{overflow-wrap:anywhere}
.tbtn{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;padding:0 2px;flex:none}
.ov{position:fixed;inset:0;background:rgba(8,18,22,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(540px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.sheet h2{font:800 20px var(--font-display);letter-spacing:-.02em;margin-bottom:16px}
.sheet .choices{margin-top:6px}
.kbd{font:500 11px var(--font-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}

.star{flex:none;background:none;border:0;font-size:20px;line-height:1;padding:6px 8px;margin:-5px -6px 0 0;color:var(--muted);border-radius:8px}
.star:hover{color:var(--signal)}
.star.on{color:var(--signal)}
.note input[type=file]{font-size:14px;max-width:100%}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:0;padding-top:10px}
  .rail{top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:4px}
  .brand{font-size:20px}
  .tag{display:none}
  .rail .brand{margin-bottom:8px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .grp{display:none}
  .nb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;flex:none}
  .nb[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .nb[aria-current="page"] .cnt{color:var(--accent-ink)}
  main{padding-top:12px;padding-bottom:110px}
  .cap{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .ov{align-items:flex-end;padding:0}
  .sheet{width:100%;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .vh h1{font-size:26px}
  .row{padding:12px}
  .acts{flex-direction:column;align-items:flex-end}
}
@media (prefers-reduced-motion:no-preference){
  .nb,.btn,.chk,.fc{transition:background-color .12s,border-color .12s,color .12s}
}
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">Open Loops</div>
    <p class="tag">GETTING THINGS DONE</p>
    <nav id="nav" class="nav" aria-label="Lists"></nav>
  </aside>
  <main>
    <form id="cap" class="cap" autocomplete="off">
      <input id="capIn" class="in" type="text" maxlength="300" enterkeyhint="send" aria-label="Capture to Inbox" placeholder="Connecting…" disabled>
      <button id="capBtn" class="btn pri" type="submit" disabled>Add</button>
    </form>
    <div id="view"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="sheet" class="ov" hidden></div>

<script>
(function(){
'use strict';

var LS='openloops.v1', LSV='openloops.view';
var DEF={ctxs:['@computer','@phone','@errands','@home','@office','@anywhere'],rv:{},lastReview:0,seeded:false};
var S={items:{},settings:Object.assign({},DEF),view:'today',ctx:'all',pid:null,clar:null,mode:'loading',ready:false,note:'',q:'',focus:false,navChanged:false,addCtx:false,sample:null,sug:null,sq:''};
var store={col:null};
var hold=0;

var VIEWS=[
  {id:'inbox',label:'Inbox',group:'Process'},
  {id:'today',label:'Today',group:'Do'},
  {id:'next',label:'Next Actions',group:'Do'},
  {id:'waiting',label:'Waiting For',group:'Do'},
  {id:'calendar',label:'Calendar',group:'Do'},
  {id:'projects',label:'Projects',group:'Track'},
  {id:'someday',label:'Someday/Maybe',group:'Track'},
  {id:'reference',label:'Reference',group:'Track'},
  {id:'review',label:'Weekly Review',group:'Reflect'},
  {id:'done',label:'Logbook',group:'Reflect'},
  {id:'search',label:'Find & Backup',group:'Reflect'}
];
var LISTNAME={inbox:'Inbox',next:'Next Actions',waiting:'Waiting For',calendar:'Calendar',someday:'Someday/Maybe',reference:'Reference'};

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function h(tag,props){
  var el=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.slice(0,2)==='on') el.addEventListener(k.slice(2),v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k,v===true?'':v);
  }}
  for(var i=2;i<arguments.length;i++) add(el,arguments[i]);
  return el;
}
function add(el,c){
  if(c==null||c===false) return;
  if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}
  el.append(c.nodeType?c:document.createTextNode(String(c)));
}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayStr(){return ymd(new Date());}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function dayDiff(a,b){var pa=a.split('-').map(Number),pb=b.split('-').map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5);}
function fmtDate(s){if(!s) return 'No date';var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtTs(ts){return ts?new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';}
function ageDays(ts){return Math.max(0,Math.floor((Date.now()-(ts||Date.now()))/864e5));}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s;}
function byCreated(a,b){return (a.created||0)-(b.created||0);}

/* ---------- data access ---------- */
function all(){return Object.keys(S.items).map(function(id){return Object.assign({id:id},S.items[id]);});}
function tasks(){return all().filter(function(x){return x.kind!=='project';});}
function projects(){return all().filter(function(x){return x.kind==='project';});}
function byList(l){return tasks().filter(function(x){return !x.done&&x.list===l;});}
function activeProjects(){return projects().filter(function(p){return p.pstatus==='active';});}
function projOpen(pid){return tasks().filter(function(x){return !x.done&&x.project===pid&&(x.list==='next'||x.list==='waiting'||x.list==='calendar');});}
function stalled(){return activeProjects().filter(function(p){return projOpen(p.id).length===0;});}
function staleWaiting(){return byList('waiting').filter(function(x){return ageDays(x.since||x.created)>=7;});}
function overdue(){var t=todayStr();return byList('calendar').filter(function(x){return (x.date||t)<t;});}
function todayCal(){var t=todayStr();return byList('calendar').filter(function(x){return (x.date||t)===t;});}
function focusItems(){var t=todayStr();return byList('next').filter(function(x){return x.focus===t;});}
function isDeferred(x){return !!x.defer&&x.defer>todayStr();}
function nextActive(){return byList('next').filter(function(x){return !isDeferred(x);});}
function advance(s,rep){
  var p=s.split('-').map(Number),d=new Date(p[0],p[1]-1,p[2]);
  if(rep==='daily') d.setDate(d.getDate()+1);
  else if(rep==='weekly') d.setDate(d.getDate()+7);
  else{var day=p[2];d.setDate(1);d.setMonth(d.getMonth()+1);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));}
  return ymd(d);
}
function nextDue(base,rep){var n=advance(base,rep),t=todayStr();while(n<=t) n=advance(n,rep);return n;}

/* ---------- persistence (cloud sync via db, local fallback) ---------- */
var chain={};
function enqueue(id,fn){
  var prev=chain[id]||Promise.resolve();
  var p=prev.catch(function(){}).then(fn);
  chain[id]=p;
  return p.catch(function(e){console.error(e);toast("Couldn't save that change. Check your connection.");});
}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({items:S.items,settings:S.settings}));}catch(e){}}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.items=j.items||{};S.settings=Object.assign({},DEF,j.settings||{});}}catch(e){}}
function put(id,data){
  var d=Object.assign({},data,{updated:Date.now()});delete d.id;
  S.items[id]=d;
  var p;
  if(S.mode==='cloud') p=enqueue(id,function(){return store.col.doc(id).set(d);}); else {saveLocal();p=Promise.resolve();}
  render();return p;
}
function patch(id,part){var cur=S.items[id];if(!cur) return Promise.resolve();return put(id,Object.assign({},cur,part));}
function del(id){
  delete S.items[id];
  var p;
  if(S.mode==='cloud') p=enqueue(id,function(){return store.col.doc(id).delete();}); else {saveLocal();p=Promise.resolve();}
  render();return p;
}
function setSettings(part){
  S.settings=Object.assign({},S.settings,part);
  var snap=Object.assign({},S.settings);
  var p;
  if(S.mode==='cloud') p=enqueue('settings',function(){return store.col.doc('settings').set(snap);}); else {saveLocal();p=Promise.resolve();}
  render();return p;
}
function batch(fn){hold++;try{fn();}finally{hold--;}render();}

/* ---------- toast ---------- */
var toastT;
function toast(msg,label,fn){
  var t=$('#toast');
  t.replaceChildren(h('span',null,msg),label?h('button',{class:'tbtn',type:'button',onclick:function(){t.hidden=true;if(fn) fn();}},label):null);
  t.hidden=false;clearTimeout(toastT);
  toastT=setTimeout(function(){t.hidden=true;},label?6500:3500);
}

/* ---------- small UI parts ---------- */
function chip(txt,cls,fn){return fn?h('button',{type:'button',class:'chip '+(cls||''),onclick:fn},txt):h('span',{class:'chip '+(cls||'')},txt);}
function head(title,sub){return h('div',{class:'vh'},h('h1',null,title),sub?h('p',{class:'sub'},sub):null);}
function sec(label,n,sig){return h('div',{class:'sec'+(sig?' sig':'')},h('span',null,label),n!=null?h('span',null,'· '+n):null);}
function listBox(rows){return h('div',{class:'list'},rows);}
function empty(title,text,extra){return h('div',{class:'empty'},h('strong',null,title),text,extra||null);}
function confirmBtn(label,fn,cls){
  var armed=false,t;
  var b=h('button',{type:'button',class:'btn '+(cls||'')},label);
  b.addEventListener('click',function(){
    if(!armed){armed=true;b.textContent='Tap again to confirm';clearTimeout(t);t=setTimeout(function(){armed=false;b.textContent=label;},3000);}
    else fn();
  });
  return b;
}
function fld(label,el,id){return h('div',{class:'fld'},h('label',{for:id},label),el);}
function select(id,opts,val){
  var s=h('select',{class:'in',id:id});
  opts.forEach(function(o){s.append(h('option',{value:o[0]},o[1]));});
  s.value=val;return s;
}

function complete(id){
  var it=S.items[id];if(!it) return;
  if(it.rep&&(it.list==='next'||it.list==='calendar')){
    var base=it.list==='calendar'?(it.date||todayStr()):(it.defer||todayStr());
    var nd=nextDue(base,it.rep),prev=Object.assign({},it),logId=newId('t');
    batch(function(){
      put(logId,Object.assign({},it,{rep:'',focus:'',defer:'',done:true,doneAt:Date.now()}));

    });

  }

function taskRow(x,o){

async function askClaude(item){
  S.sug={id:item.id,loading:true};render();
  var projs=activeProjects().map(function(p){return p.t;});
  var wd=new Date().toLocaleDateString('en-US',{weekday:'long'});
  var prompt='You are helping someone use the Getting Things Done method. Today is '+todayStr()+' ('+wd+'). Decide how to file one captured inbox item.\n\nItem: '+JSON.stringify(item.t)+'\nNotes: '+JSON.stringify(item.n||'')+'\nContexts: '+S.settings.ctxs.join(', ')+'\nActive projects: '+JSON.stringify(projs)+'\n\nReply with only one JSON object with these keys: list (one of next, waiting, calendar, someday, reference, trash), action (the item rewritten as a concrete next physical action starting with a verb, or the original text for someday, reference or trash), ctx (one of the contexts, for next only), project (exact name of an active project it belongs to, or empty string), who (person waited on, for waiting only), date (YYYY-MM-DD, for calendar only, and only when it must happen on a specific day), why (one short sentence). If it needs more than one step, file the first step and say so in why.';
  try{
    var r=await S.sample.json(prompt,{modelTier:'quick'});
    var lists=['next','waiting','calendar','someday','reference','trash'];
    var list=lists.indexOf(r&&r.list)>=0?r.list:'next';
    var date=/^\d{4}-\d{2}-\d{2}$/.test(r&&r.date||'')?r.date:'';
    if(list==='calendar'&&!date) list='next';
    var pj=activeProjects().filter(function(p){return p.t===(r&&r.project);})[0];
    var ctx=S.settings.ctxs.indexOf(r&&r.ctx)>=0?r.ctx:'@anywhere';
    S.sug={id:item.id,res:{list:list,action:trunc(String((r&&r.action)||item.t),300),ctx:ctx,projectId:pj?pj.id:'',projectName:pj?pj.t:'',who:trunc(String((r&&r.who)||'someone'),120),date:date,why:trunc(String((r&&r.why)||''),220)}};
  }catch(e){
    var code=e&&e.code;
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed'){S.sample=null;S.sug=null;}
    else S.sug={id:item.id,err:code==='rate_limited'?'Too many requests right now. Try again in a minute.':"Claude couldn't suggest anything this time."};
  }
  render();
}
function applySuggestion(item,r){
  var d={action:r.action,projectId:r.projectId||''};
  S.sug=null;
  if(r.list==='trash'){trashItem(item.id);return;}
  if(r.list==='someday'){S.clar=null;patch(item.id,{list:'someday'});toast('Moved to Someday/Maybe');return;}
  if(r.list==='reference'){S.clar=null;patch(item.id,{list:'reference'});toast('Filed in Reference');return;}
  if(r.list==='waiting'){commit(item,d,{list:'waiting',who:r.who,since:Date.now()},'Added to Waiting For');return;}
  if(r.list==='calendar'){commit(item,d,{list:'calendar',date:r.date},'Added to Calendar for '+fmtDate(r.date));return;}
  commit(item,d,{list:'next',ctx:r.ctx},'Added to Next Actions '+r.ctx);
}
function clarifyCard(item,total){
  var c=S.clar,d=c.d;
  function go(s,p){Object.assign(d,p||{});c.hist.push(c.step);c.step=s;S.focus=true;render();}
  function back(){c.step=c.hist.pop()||'actionable';S.focus=false;render();}
  var card=h('section',{class:'clar','aria-live':'polite'});
  card.append(h('div',{class:'eyebrow'},'Clarify · '+total+' in inbox'),h('div',{class:'thing'},item.t));
  function q(t,hint){card.append(h('h2',{class:'q'},t));if(hint) card.append(h('p',{class:'hint'},hint));}
  function opts(){card.append(h('div',{class:'choices'},Array.prototype.slice.call(arguments)));}
  function btn(label,fn,cls){return h('button',{type:'button',class:'btn big '+(cls||''),onclick:fn},label);}
  function form(fields,label,onsub){
    var f=h('form',{onsubmit:function(e){e.preventDefault();onsub();}},fields,h('div',{class:'choices'},h('button',{type:'submit',class:'btn pri big'},label)));
    card.append(f);
  }
  switch(c.step){
    case 'actionable':
      q('Is it actionable?','Is there a physical action you could take on this?');
      opts(btn('Yes',function(){go('size');}),btn('No',function(){go('noaction');}));
      if(S.sample) card.append(suggestBlock(item));
      break;
    case 'noaction':
      q('Then what is it?');
      opts(
        btn('Trash',function(){trashItem(item.id);}),
        btn('Someday/Maybe',function(){S.clar=null;patch(item.id,{list:'someday'});toast('Moved to Someday/Maybe');}),
        btn('Reference',function(){S.clar=null;patch(item.id,{list:'reference'});toast('Filed in Reference');}));
      break;
    case 'size':
      q('Does it take more than one step?','If it takes more than one step, it is a project.');
      opts(btn('One step',function(){go('action',{isProject:false});}),btn('More than one step',function(){go('action',{isProject:true});}));
      break;
    case 'action':
      (function(){
        q(d.isProject?'Name the project and its first action':'What is the next action?',d.isProject?'Name the finished outcome, then the first physical action toward it.':'Start with a verb. What would you physically do first?');
        var fields=[];
        if(d.isProject) fields.push(fld('Project outcome',h('input',{class:'in',id:'cl-proj',type:'text',maxlength:'300',value:d.proj||item.t}),'cl-proj'));
        fields.push(fld(d.isProject?'First next action':'Next action',h('input',{class:'in',id:'cl-act',type:'text',maxlength:'300','data-af':true,value:d.action||(d.isProject?'':item.t)}),'cl-act'));
        if(!d.isProject){
          var opt=[['','No project']].concat(activeProjects().map(function(p){return [p.id,p.t];}));
          fields.push(fld('Project (optional)',select('cl-pid',opt,d.projectId||''),'cl-pid'));
        }
        form(fields,'Continue',function(){
          var a=$('#cl-act').value.trim();if(!a){$('#cl-act').focus();return;}
          var p='';if(d.isProject){p=$('#cl-proj').value.trim();if(!p){$('#cl-proj').focus();return;}}
          var pid=d.isProject?'':$('#cl-pid').value;
          go(d.isProject?'whose':'twomin',{action:a,proj:p,projectId:pid});
        });
      })();
      break;
    case 'twomin':
      q('Will it take under two minutes?','If it does, do it now instead of tracking it.');
      opts(btn('Yes, doing it now',function(){commit(item,d,{list:'next',ctx:'',done:true,doneAt:Date.now()},'Logged as done. Go do it.');}),btn('No, it takes longer',function(){go('whose');}));
      break;
    case 'whose':
      q('Whose move is it?');
      opts(btn('Mine',function(){go('when');}),btn('Someone else’s',function(){go('who');}));
      break;
    case 'who':
      q('Who are you waiting on?','You will see how many days it has been.');
      form([fld('Waiting on',h('input',{class:'in',id:'cl-who',type:'text',maxlength:'120','data-af':true,value:''}),'cl-who')],'Add to Waiting For',function(){
        var w=$('#cl-who').value.trim();if(!w){$('#cl-who').focus();return;}
        commit(item,d,{list:'waiting',who:w,since:Date.now()},'Added to Waiting For');
      });
      break;
    case 'when':
      q('Does it have to happen on a specific day?','The calendar is only for things tied to a date or time.');
      opts(btn('Yes, pick a date',function(){go('date');}),btn('No, any time in the right context',function(){go('ctx');}));
      break;
    case 'date':
      q('Which day?');
      form([fld('Date',h('input',{class:'in',id:'cl-date',type:'date','data-af':true,value:d.date||todayStr()}),'cl-date')],'Add to Calendar',function(){
        var v=$('#cl-date').value||todayStr();
        commit(item,d,{list:'calendar',date:v},'Added to Calendar for '+fmtDate(v));
      });
      break;
    case 'ctx':
      q('Where or with what can you do it?');
      opts.apply(null,S.settings.ctxs.map(function(cx){return btn(cx,function(){commit(item,d,{list:'next',ctx:cx},'Added to Next Actions '+cx);});}));
      break;
  }
  var links=h('div',{class:'links'});
  if(c.hist.length) links.append(h('button',{type:'button',class:'link',onclick:back},'← Back'));
  links.append(h('button',{type:'button',class:'link',onclick:function(){openEdit(item.id);}},'Edit text or notes'));
  card.append(links);
  return card;
}

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCsv(){
  var rows=[['title','type','list','context','project','waiting_on','date','hide_until','repeats','done','notes']];
  all().sort(byCreated).forEach(function(x){
    var isP=x.kind==='project';
    rows.push([x.t,isP?'project':'task',isP?(x.pstatus||''):(LISTNAME[x.list]||x.list||''),x.ctx||'',(x.project&&S.items[x.project])?S.items[x.project].t:'',x.who||'',x.date||'',x.defer||'',x.rep||'',(x.done||x.pstatus==='done')?'yes':'',x.n||'']);
  });
  return rows.map(function(r){return r.map(csvCell).join(',');}).join('\n');
}
async function saveFile(name,data){
  try{
    var type=/\.csv$/.test(name)?'text/csv':'application/json';
    var blob=new Blob([data],{type:type+';charset=utf-8'});
    var file=null;
    try{file=new File([blob],name,{type:type});}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad/.test(navigator.userAgent)){
      await navigator.share({files:[file]});toast('Saved '+name);return;
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
    toast('Saved '+name);
  }catch(e){
    if(e&&e.name==='AbortError') return;
    toast('Could not save the file here.');
  }
}

    t({t:'Plan a weekend trip for spring',list:'inbox'});
    t({t:'Look into standing desk options',list:'inbox'});
    t({t:'Buy shelving brackets',list:'next',ctx:'@errands',project:pid});
    t({t:'Email landlord about the parking spot',list:'next',ctx:'@computer'});
    t({t:'Call the pharmacy about the refill',list:'next',ctx:'@phone'});
    t({t:'Quote for driveway repair',list:'waiting',who:'the contractor',since:now-9*864e5});
    t({t:'Dentist appointment',list:'calendar',date:addDays(4)});
    t({t:'Learn to play piano',list:'someday'});
    t({t:'Wi-Fi router settings',list:'reference',n:'Admin page address, where the account number is printed, and which cable goes where.'});
  });
  setSettings({seeded:true});
  toast('Example items added. Clarify the first one.');
}
function removeExamples(){
  batch(function(){all().forEach(function(x){if(x.ex) del(x.id);});S.clar=null;});
  toast('Examples removed');
}

/* ---------- quick add ---------- */
var WDAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDateWord(w){
  if(w==='today') return todayStr();
  if(w==='tomorrow'||w==='tmrw') return addDays(1);
  var i=WDAYS.indexOf(w);
  if(i<0) i=WDAYS.map(function(x){return x.slice(0,3);}).indexOf(w);
  if(i>=0){var diff=(i-new Date().getDay()+7)%7||7;return addDays(diff);}
  var m=/^(\d{1,2})\/(\d{1,2})$/.exec(w);
  if(m){var mo=+m[1],dy=+m[2];if(mo>=1&&mo<=12&&dy>=1&&dy<=31){var y=new Date().getFullYear(),s=y+'-'+pad(mo)+'-'+pad(dy);if(s<todayStr()) s=(y+1)+'-'+pad(mo)+'-'+pad(dy);return s;}}
  return '';
}
function matchCtx(tok){
  var c=S.settings.ctxs,hit=c.filter(function(x){return x===tok;})[0]||c.filter(function(x){return x.indexOf(tok)===0;})[0];
  if(hit) return hit;
  setSettings({ctxs:c.concat([tok])});return tok;
}
function matchProject(slug){
  var name=slug.replace(/-/g,' '),ps=activeProjects();
  var hit=ps.filter(function(p){return p.t.toLowerCase()===name;})[0]||ps.filter(function(p){return p.t.toLowerCase().indexOf(name)===0;})[0]||ps.filter(function(p){return p.t.toLowerCase().indexOf(name)>=0;})[0];
  return hit?hit.id:'';
}
function parseQuick(raw){
  var text=raw,r={ctx:'',project:'',date:'',defer:'',rep:'',t:''},m;
  m=/\bin (\d{1,3}) days?\b/i.exec(text);
  if(m){r.date=addDays(+m[1]);text=text.replace(m[0],' ');}
  m=/\bevery (day|week|month)\b/i.exec(text);
  if(m){r.rep={day:'daily',week:'weekly',month:'monthly'}[m[1].toLowerCase()];text=text.replace(m[0],' ');}
  var out=[];
  text.split(/\s+/).forEach(function(tok){
    if(!tok) return;
    var low=tok.toLowerCase().replace(/[.,;!?]+$/,''),d;
    if(/^@[\w-]+$/.test(low)&&!r.ctx){r.ctx=low;return;}
    if(/^#[\w-]+$/.test(low)&&!r.project){var pid=matchProject(low.slice(1));if(pid){r.project=pid;return;}}
    if(low.charAt(0)==='~'&&!r.defer&&(d=parseDateWord(low.slice(1)))){r.defer=d;return;}
    out.push(tok);
  });
  var meta=function(){return out.length>1;};
  if(meta()){
    var last=out[out.length-1].toLowerCase().replace(/[.,;!?]+$/,'');
    if(!r.rep&&/^(daily|weekly|monthly)$/.test(last)){r.rep=last;out.pop();}
    else if(!r.date&&parseDateWord(last)){r.date=parseDateWord(last);out.pop();if(out.length>1&&/^(on|by|due)$/i.test(out[out.length-1])) out.pop();}
  }
  if(r.ctx) r.ctx=matchCtx(r.ctx);
  r.t=out.join(' ').trim();
  return r;
}

/* ---------- capture ---------- */
$('#cap').addEventListener('submit',function(e){
  e.preventDefault();
  var i=$('#capIn'),v=i.value.trim();if(!v) return;
  var base={kind:'task',n:'',project:'',ctx:'',who:'',date:'',done:false,created:Date.now()};
  var q=parseQuick(v),id=newId('t');
  if(q.t&&(q.ctx||q.project||q.date||q.defer||q.rep)){
    var cal=!!q.date;
    put(id,Object.assign({},base,{t:q.t,list:cal?'calendar':'next',ctx:cal?'':(q.ctx||'@anywhere'),project:q.project,date:q.date,defer:q.defer,rep:q.rep}));
    toast(cal?'Added to Calendar for '+fmtDate(q.date):'Added to Next Actions '+(q.ctx||'@anywhere'),'Undo',function(){batch(function(){del(id);put(newId('t'),Object.assign({},base,{t:v,list:'inbox'}));});});
  } else {
    put(id,Object.assign({},base,{t:v,list:'inbox'}));
    if(S.view!=='inbox') toast('Added to Inbox');
  }
  i.value='';
  i.focus();
});

/* ---------- start ---------- */
function init(){
  try{var v=localStorage.getItem(LSV);if(v&&VIEWS.some(function(x){return x.id===v;})) S.view=v;}catch(e){}
  loadLocal();S.mode='local';S.ready=true;
  render();
  window.addEventListener('storage',function(e){if(e.key===LS){loadLocal();scheduleRender();}});
  try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js');}catch(e){}
}
init();
})();
